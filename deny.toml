# Dependency policy gate for the rules written in docs/verification.md.
#
# Boreas is AGPL-3.0-only. Combining a dependency into this work and then
# distributing it requires that dependency to be GPL-compatible: permissive
# licences qualify, MPL-2.0 qualifies through its secondary-license mechanism,
# and GPL-3.0-or-later qualifies through the GPLv3/AGPLv3 linking permission.
# Licences that do not qualify include GPL-2.0-only, EPL, CDDL, and every
# source-available licence such as SSPL, BUSL, and the Elastic Licence.
#
# The list below is deliberately narrower than that legal set. It is a project
# policy allowlist, so pulling any copyleft dependency into the graph fails the
# build and forces a human decision rather than passing silently.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Covers every licence named in the dependency table in docs/verification.md.
# Entries not yet in the graph are deliberate pre-authorisations for planned
# dependencies, so an unused allowance is not a warning.
# AGPL-3.0-only is this crate's own licence, not an inbound one.
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.93

[bans]
# A duplicated dependency is worth seeing on a mobile target, but it is a
# packaging smell rather than a correctness failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
