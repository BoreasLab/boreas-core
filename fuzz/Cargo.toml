[package]
name = "boreas-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# `cargo fuzz` keeps this crate out of the root workspace, because its
# dependencies and its RUSTFLAGS are not ones an ordinary build wants. The
# consequence is that `[patch]` does not reach here: patches apply only to the
# workspace that declares them, so without this stanza the graph resolves
# `quiche` against `boring 4.x`, meets `boreas-core`'s own `boring 5.2`, and
# fails on `links = "boringssl"`. The path is the same generated tree the root
# points at; see ../vendor/README.md.
[patch.crates-io]
h2 = { path = "../vendor/h2" }
quiche = { path = "../vendor/quiche" }

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.boreas-core]
path = ".."

[[bin]]
name = "reassembler"
path = "fuzz_targets/reassembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clamp_mss"
path = "fuzz_targets/clamp_mss.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datapath"
path = "fuzz_targets/datapath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false
