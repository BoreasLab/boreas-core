name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # scripts/vendor.py carries its own PEP 723 environment — an interpreter
      # floor and an empty dependency set — and uv is what honours it, so CI
      # and a contributor's checkout execute the same interpreter.
      #
      # **Exact version, and it has to be.** Every other action here is pinned
      # to a moving major; setup-uv publishes no such tag, so `@v10` names
      # nothing and the job fails while resolving actions, before a step runs.
      # sync-vendor.yml carried `@v9` and failed that way every week.
      - uses: astral-sh/setup-uv@v10.0.1

      # vendor/<name>/ is generated from vendor/patches/<name>.patch, and these
      # are what prove it still is. No network and no build, so they run first
      # and cost seconds: a tree edited by hand, or a patch nobody
      # re-materialised, fails here rather than riding into a commit.
      - run: uv run scripts/vendor.py --check
      - run: uv run scripts/vendor.py --selftest
      - run: uvx ruff@0.16.1 check scripts/
      - run: uvx ruff@0.16.1 format --check scripts/

      # `api/` is a contract, and a downstream integrator following a link into
      # nothing pays for it in trust before they pay for it in time. A rename
      # is what breaks these, so the check belongs where a rename lands.
      - run: uv run scripts/doclinks.py

      # One ignore file, at the root, because a nested one outranks it: that is
      # how a vendored crate's own rules once hid a file from `git add` that
      # `Vendor.lock` had already hashed. `git ls-files` does not descend into
      # the `.claude/skills` symlink, so nothing there needs excepting.
      - name: one authoritative .gitignore
        run: |
          stray=$(git ls-files '*.gitignore' ':!:.gitignore')
          test -z "$stray" || { echo "nested .gitignore: $stray"; exit 1; }

      # The three commands AGENTS.md requires before any change lands.
      # clippy runs as a rustc wrapper, so -D warnings also fails plain
      # rustc lints such as unused imports across tests and benches.
      # `--workspace`, because `ffi/` is a member and a root-package-only run
      # would leave the C boundary — the one place an unwind is fatal and a
      # pointer is unchecked — compiled by nobody.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # The suite that checks these protocols against a decoder Boreas did not
  # write. It ran on every pull request already and proved nothing: without
  # `BOREAS_SINGBOX` every test skipped itself and passed, so the one gate that
  # can catch a misread specification was reporting green for doing nothing.
  # `BOREAS_INTEROP=required` is what turns a missing reference into a failure.
  interop:
    name: interop against sing-box
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Version and digest are pinned in the script, so the binary is verified
      # rather than merely downloaded, and a contributor runs the same one.
      # Assigned on its own line, then echoed. `echo "X=$(cmd)"` reports
      # `echo`'s status, so a failed fetch would set an empty variable and pass
      # this step -- one of the `set -e` gaps that makes a green step a lie.
      - name: Fetch the pinned reference
        run: |
          binary=$(scripts/reference.sh)
          echo "BOREAS_SINGBOX=$binary" >> "$GITHUB_ENV"

      - run: cargo test --test interop
        env:
          BOREAS_INTEROP: required

  windows:
    name: windows check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ring compiles C with MSVC, so only a real Windows runner can check the
      # Wintun adapter and GotaTun together; the Linux cross-check ended with
      # P10's dependency on ring.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Android is `#[cfg(unix)]`, so the check job compiles it as generic Linux
  # and has never seen the target it actually ships to. `boring-sys` and `ring`
  # build C, so this needs the NDK's clang rather than the host's -- which is
  # exactly the class of breakage a Linux build cannot show.
  android:
    name: android check
    runs-on: ubuntu-latest
    # Linking BoringSSL for a foreign architecture is not a five-minute job.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One ABI here, all four in the release workflow: this job exists to
      # catch a C dependency that will not cross-compile, and the first target
      # to do that catches it. A matrix of one, so the steps are the same steps.
      matrix:
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # `xtask` owns the mapping from the name Gradle uses to the target Rust
      # uses to the triple the NDK's compiler is named after — three names that
      # do not all agree, in three different types so they cannot be confused.
      - name: Resolve the target
        id: target
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          target=$(cargo xtask android-target "$ABI")
          echo "rust=$target" >> "$GITHUB_OUTPUT"
          rustup target add "$target"

      # **Before `rust-cache`, and that ordering is load-bearing.** The cache
      # key includes every env var named `CC*`, `CXX*`, `CFLAGS*`, or `CMAKE*`,
      # but it reads them when it runs — so setting the toolchain afterwards
      # leaves the compilers out of the key entirely.
      #
      # This also writes the CMake wrapper that turns `BUILD_TESTING` off; see
      # `Ndk::cmake_wrapper` for why BoringSSL's test tree cannot cross-compile.
      - name: Point the C toolchain at the NDK
        env:
          ABI: ${{ matrix.abi }}
        run: cargo xtask android-env "$ABI" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.abi }}

      # **A CMake build tree cannot be restored across a toolchain change, and
      # the cache key cannot prevent it**: `rust-cache` falls back to a
      # prefix-matched older entry when the exact key misses. Two things go
      # stale in there and both are fatal — the compiler identity, because a
      # toolchain file is only honoured on a tree's first configure, and
      # Benchmark's `HAVE_STD_REGEX=FALSE`, which it writes with `FORCE` and
      # short-circuits on ever after.
      - name: Discard any restored BoringSSL build tree
        run: rm -rf target/*/*/build/boring-sys-* target/*/build/boring-sys-*

      # **`build`, not `check`.** This job ran `cargo check` for its whole life
      # and never linked anything, which is exactly how a `libcrypto.a` full of
      # *host* objects rode a green CI run all the way to the first release that
      # tried to link it. `boreas-ffi` is a `cdylib`, so `build --lib` performs
      # the link that `check` skips, and the C toolchain is proved rather than
      # merely configured. It costs a BoringSSL compile; that is the price of
      # the check being real.
      #
      # `--lib` rather than `--all-targets`: the library is what ships to a
      # handset, and cross-compiling the test and example targets would gate
      # the Android build on dev-dependencies that never reach the device.
      #
      # Both crates. `boreas-ffi`'s JNI layer is `#[cfg(target_os = "android")]`,
      # so this job is the only one that compiles it at all.
      - name: Build
        # The log needs credentials to read; annotations do not. Surface the
        # lines that say why a build failed so a failure is diagnosable from
        # the public API.
        run: |
          set -o pipefail
          cargo build --target "${{ steps.target.outputs.rust }}" --lib -p boreas-core -p boreas-ffi 2>&1 | tee build.log || {
            df -h . | tail -1
            grep -E '^error|LLVM ERROR|error:|No space' build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly for the sanitizer instrumentation.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Before the install, because it is the cheap half. The fuzz crate is a
      # separate workspace — `cargo clippy --all-targets` in the check job
      # never compiles it — so a library change that breaks a fuzz target
      # surfaces here, in seconds, rather than after cargo-fuzz has built.
      #
      # `--cfg fuzzing` is what cargo-fuzz sets, and it is load-bearing rather
      # than decorative: it switches on `cfg(fuzzing)` code inside dependencies,
      # and a vendored crate is a *path* dependency, which cargo does not cap
      # lints for. Without the flag this compiles a different graph than the
      # campaign below and cannot stand in for it.
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
        env:
          RUSTFLAGS: --cfg fuzzing

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A smoke run, not a campaign: each target gets one minute, which is
      # enough to catch a reachable panic on the untrusted paths and cheap
      # enough to gate every pull request. Longer campaigns run out of band.
      - run: |
          for target in reassembler clamp_mss datapath dns; do
            cargo fuzz run "$target" -- -max_total_time=60
          done
        working-directory: .

  deny:
    name: advisories and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # No repository config: cargo-deny's built-in defaults already error on
      # RustSec vulnerability and notice advisories, fail on unmaintained
      # crates, and deny an unknown registry or git source. `bans` is left out
      # because its knobs both default to `warn`, so it can never fail a run,
      # and `licenses` is left out deliberately.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
