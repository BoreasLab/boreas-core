name: Release

# Two triggers, two kinds of tag, one pipeline.
#
# A push to `main` cuts a **pre-release**: `cargo xtask resolve` names it
# after the patch that has not happened yet, stamped with the time and the
# commit, and GitHub marks it pre-release so it never becomes "Latest".
#
# A `v*` tag pushed by hand cuts a **release**. That is the only thing a human
# does here, and it is the whole act: **the tag is the version.** Nothing has to
# be bumped first, so there is no step to forget and no gate that fires when you
# forget it.
#
# Path filters are deliberately absent. A docs-only push does produce a
# byte-identical library and one more pre-release, which is a cost; a filter
# that is wrong in the other direction silently withholds a build from the two
# applications waiting for it, which is worse.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# No ambient capability. Each job asks for exactly the effects it performs.
permissions: {}

# Releases queue rather than cancel. A cancelled release leaves a tag with no
# assets behind it, which is the one state a consumer cannot recover from.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # What is being published, decided once so every job below agrees.
  plan:
    name: name the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
      prerelease: ${{ steps.name.outputs.prerelease }}
    steps:
      # `fetch-depth: 0` because the tag algebra reads every release tag to
      # find the newest; a shallow clone carries none of them and the base
      # version would fall back to `0.0.1` on every build forever.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      # **No branch here, and that is the point.** `xtask resolve` reads the
      # event from `GITHUB_REF_TYPE`, which GitHub already sets, and returns one
      # of two variants; a release event with no tag is not a state it can be
      # asked about. The only refusal is at the parser — a ref that is not a
      # release tag never becomes a release — because the tag is the sole place
      # a version is written and so there is nothing left to disagree with.
      - name: Decide the tag
        id: name
        run: cargo xtask resolve | tee -a "$GITHUB_OUTPUT"

  # The gate, on every release including pre-releases. `ci.yml` runs on the same
  # push, but the two are independent workflows: without this, a red `main`
  # would publish an artefact that the applications downstream would integrate
  # before anyone noticed.
  gate:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run scripts/vendor.py --check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # One shared object per ABI. `xtask` owns the three names each ABI has —
  # Gradle's, Rust's, and the NDK compiler's — in three distinct types, so
  # using one where another belongs does not compile.
  android:
    name: android ${{ matrix.abi }}
    needs: [plan, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Every ABI's result matters on its own: shipping three of four is worse
      # than shipping none, because the missing one fails at install time on a
      # device nobody tested with.
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # `xtask` owns the mapping from the name Gradle uses to the target Rust
      # uses to the triple the NDK's compiler is named after — three names that
      # do not all agree, in three different types so they cannot be confused.
      - name: Resolve the target
        id: target
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          target=$(cargo xtask android-target "$ABI")
          echo "rust=$target" >> "$GITHUB_OUTPUT"
          rustup target add "$target"

      # **Before `rust-cache`, and that ordering is load-bearing.** The cache
      # key includes every env var named `CC*`, `CXX*`, `CFLAGS*`, or `CMAKE*`,
      # but it reads them when it runs — so setting the toolchain afterwards
      # leaves the compilers out of the key entirely.
      #
      # This also writes the CMake wrapper that turns `BUILD_TESTING` off; see
      # `Ndk::cmake_wrapper` for why BoringSSL's test tree cannot cross-compile.
      - name: Point the C toolchain at the NDK
        env:
          ABI: ${{ matrix.abi }}
        run: cargo xtask android-env "$ABI" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.abi }}

      # **A CMake build tree cannot be restored across a toolchain change, and
      # the cache key cannot prevent it**: `rust-cache` falls back to a
      # prefix-matched older entry when the exact key misses. Two things go
      # stale in there and both are fatal — the compiler identity, because a
      # toolchain file is only honoured on a tree's first configure, and
      # Benchmark's `HAVE_STD_REGEX=FALSE`, which it writes with `FORCE` and
      # short-circuits on ever after.
      - name: Discard any restored BoringSSL build tree
        run: rm -rf target/*/*/build/boring-sys-* target/*/build/boring-sys-*

      - name: Build
        env:
          RUST: ${{ steps.target.outputs.rust }}
        run: cargo build --release --target "$RUST" -p boreas-ffi

      # Laid out as Gradle's `jniLibs` source set expects it, so unpacking the
      # archive downstream is a copy rather than a rename.
      #
      # This also reads the shared object's `NEEDED` entries and fails when one
      # is neither an Android platform library nor a file staged beside it.
      # `libc++_shared.so` shipped missing once, which no build-time check
      # could catch: the link succeeds and the failure arrives at `dlopen` on a
      # device. Staging and checking are one command so they cannot come apart.
      - name: Stage
        env:
          ABI: ${{ matrix.abi }}
        run: cargo xtask android-stage "$ABI" staging

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: staging/
          if-no-files-found: error
          retention-days: 1

  # `ring` and `boring-sys` compile C with MSVC, so this is the only host that
  # can produce the DLL at all — there is no cross-compile from Linux.
  windows:
    name: windows ${{ matrix.rid }}
    needs: [plan, gate]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            rust: x86_64-pc-windows-msvc
          - rid: win-arm64
            rust: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rid }}

      - name: Build
        run: cargo build --release --target ${{ matrix.rust }} -p boreas-ffi

      # `runtimes/<rid>/native/` is the layout .NET already resolves a native
      # dependency from, so a consuming project references the folder rather
      # than copying one DLL per architecture by hand.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/runtimes/${{ matrix.rid }}/native"
          cp "target/${{ matrix.rust }}/release/boreas.dll" \
             "staging/runtimes/${{ matrix.rid }}/native/"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: staging/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: package, attest, publish
    needs: [plan, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Creating the tag and the release.
      contents: write
      # Signing the provenance: `id-token` mints the OIDC token Sigstore issues
      # a short-lived certificate against, `attestations` persists the result,
      # and `artifact-metadata` creates the storage record it hangs from.
      #
      # `actionlint` through v1.7.7 calls `artifact-metadata` an unknown scope.
      # Its list is compiled in and predates the scope; GitHub's own workflow
      # syntax reference carries it, alongside `code-quality` and
      # `vulnerability-alerts`, which that version also does not know.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      # Every job staged into the same shape, so merging them is a copy. The
      # header ships in both archives: it is the source of truth the Kotlin and
      # C# declarations are written against, and a consumer holding a binary
      # without it has no way to check what it agreed to.
      - name: Assemble
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist android windows
          cp -r incoming/android-*/. android/
          cp -r incoming/windows-*/. windows/
          for platform in android windows; do
            mkdir -p "$platform/include"
            cp ffi/include/boreas.h "$platform/include/"
          done
          tar -czf "dist/boreas-$VERSION-android.tar.gz" -C android .
          (cd windows && zip -qr "../dist/boreas-$VERSION-windows.zip" .)
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      # Provenance over the archives themselves, which is what a consumer
      # actually downloads. `gh attestation verify` then answers "was this built
      # by that workflow, from that commit" without trusting the release page.
      - uses: actions/attest@v4
        with:
          subject-path: 'dist/boreas-*'

      # `gh release create` makes the tag as well, so a pre-release needs no
      # separate push — and the tag can only ever name the commit that produced
      # the assets attached to it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          flags=(--target "$SHA" --generate-notes)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" --title "$TAG" dist/*
