[package]
name = "boreas-core"
# **Not the released version.** Cargo demands a version here; the released one
# comes from the git tag, and `cargo xtask resolve` never reads this field. It
# is the fallback an untagged local build carries, and nothing more — a second
# place to write a version is a second place for it to disagree.
version = "0.1.0"
edition = "2024"

# Crates this workspace patches. Each path here is a *generated* tree:
# `scripts/vendor.py` fetches the pristine crates.io package and applies
# `vendor/patches/<name>.patch` to it, and `vendor/Vendor.lock` records the
# digests that tie the two together, which `--check` verifies in CI. The
# version each entry vendors is the requirement under `[dependencies]` below —
# there is deliberately no second place to write one.
#
# `quiche` is here because `boring-sys` declares `links = "boringssl"`, which
# Cargo permits once per graph, so quiche's `boring = "^4.3"` would otherwise
# bind Boreas's own originating-TLS seam to a BoringSSL from May 2023 that
# predates `X25519MLKEM768`. `h2` is here because pseudo-header order is the
# fourth field of the Akamai HTTP/2 fingerprint and h2 hard-codes an order no
# browser sends. `vendor/README.md` carries both arguments and says what
# retires each entry.
# `ffi/` is a member rather than its own workspace, unlike `fuzz/`: it links
# this library and ships beside it, so it must resolve the same dependency
# versions and the same `[patch.crates-io]` entries below. A second workspace
# would duplicate both and let them drift.
[workspace]
members = ["ffi", "xtask"]
# `xtask` is the build pipeline — the Android ABI table and the release tag
# algebra — and it is a member so `cargo test --workspace` runs its tests and
# `cargo clippy --workspace` lints it. It is *not* a default member: `cargo
# build` at the root builds what ships, and a CI tool is not that.
default-members = [".", "ffi"]
# `fuzz/` stays out. It is its own workspace on purpose — a nightly toolchain,
# sanitiser instrumentation, and `libfuzzer-sys`, none of which belong in the
# graph an ordinary `cargo build` resolves. Naming it here is what keeps
# cargo from adopting it because it happens to sit in this directory.
exclude = ["fuzz"]

[patch.crates-io]
h2 = { path = "vendor/h2" }
quiche = { path = "vendor/quiche" }

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
bytes = "1.12.1"
etherparse = "0.21.0"
gotatun = { version = "0.8.1", default-features = false, features = ["ring"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client", "http1", "http2"] }
# HTTP/2 for the gRPC and HTTP VLESS transports, and `http`/`httparse` for
# building their requests and reading the HTTPUpgrade response. All three are
# already in the graph beneath `hyper`, so naming them here adds no code to the
# artefact — it only stops us reaching through a re-export for types we use
# directly.
h2 = "0.4.15"
http = "1.5.0"
httparse = "1.10.1"
# The P16 HTML tier. `lol_html` is Cloudflare's production streaming rewriter,
# which is what [Filtering](docs/filtering.md) names: it parses without a DOM,
# so a response is transformed as it arrives rather than buffered whole, and it
# carries the two things a proxy actually needs from such a thing — a hard
# memory ceiling per stream, and a bail-out that flushes what it was holding
# instead of losing it. `encoding_rs` and `base64` come with it and are named
# here because this crate calls them directly: the first to turn a `charset`
# label into an encoding, the second to write the `'sha256-...'` source that
# widens a Content-Security-Policy by exactly the style Boreas injects.
base64 = "0.22.1"
encoding_rs = "0.8.35"
lol_html = "3.0.1"
# BoringSSL, for every TLS handshake Boreas *initiates*.
#
# The invariant is one sentence: **rustls is the server and BoringSSL is the
# client.** Terminating the local browser has no fidelity requirement — the peer
# is an application on this device, and nothing fingerprints it — so that leg
# keeps rustls and its memory safety. Every leg that dials out is fingerprinted
# by whoever answers, and rustls has no supported way to shape a ClientHello:
# extension order, GREASE placement, and JA3/JA4-matching hellos are long-
# standing open requests (rustls#1421, #1501, #1932, #2498), and `Acceptor` only
# lets you *read* a peer's. BoringSSL is what Chrome itself speaks, so matching
# it is configuration rather than reimplementation.
#
# **This is not a new C dependency; it is a promotion.** `quiche` already links
# BoringSSL through this same crate, so the artefact gains no library — it gains
# a direct edge to one that was already there. See `[patch.crates-io]` above for
# why the version had to move, and `src/intercept/mirror.rs` for what is done
# with it.
#
# `tokio-boring` is the async adapter, versioned in lockstep by its authors.
boring = "5.2"
tokio-boring = "5.2"
# Content-coding decoders for the HTML tier, and **decoders only**.
#
# A compressed document is opaque to a rewriter, so the tier can read every
# coding a browser asks for: gzip, deflate, Brotli, and Zstandard. That set is
# not a convenience — it is what lets `Accept-Encoding` be **forwarded
# verbatim**. Rewriting the field to `identity` would announce the proxy in the
# one header a bot detector reads first, and would cost a document's worth of
# bandwidth on a phone; a coding outside the set still forwards untouched, on
# the same fail-open path an unsupported charset takes.
#
# **Nothing is recompressed on the way out, and that is a property of where the
# bytes go rather than a shortcut.** The leg from Boreas to the browser is
# local: the client's TCP connection is terminated on this device, so those
# bytes never touch a network. Recompressing them would spend CPU on a mobile
# battery to shrink a memory copy. The rewritten document is emitted as
# `identity` with streaming framing, which is exactly what
# [Filtering](docs/filtering.md)'s step 6 asks for.
#
# All three are pure Rust and decode-only, which is what makes them cross-compile
# to Android with no toolchain of their own and keeps encoder tables out of the
# artefact: `rust_backend` keeps flate2 on `miniz_oxide` rather than a C zlib,
# `brotli-decompressor` is the decoder half of the `brotli` crate, and `ruzstd`
# is a decoder with no libzstd behind it. `ruzstd` offers only a pull interface,
# so `src/intercept/rewrite.rs` carries the push adapter and the bound that
# goes with it.
brotli-decompressor = { version = "5.0.3", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
# The rule engine, as [Filtering](docs/filtering.md) specifies: `adblock`
# decides and `lol_html` transforms. Brave's implementation is the one shipping
# in a browser against the same lists Boreas targets, and it covers the two
# faculties the name tier counts as deferred — full URL matching with
# `$third-party`, `$script`, and `$domain=` options, and hostname-scoped
# cosmetic rules — neither of which is a parser worth writing twice.
#
# **`single-thread` is a default feature and must be off.** It swaps the
# engine's `Arc`s for `Rc`s, which costs `Send + Sync`; the crate's own static
# assertions only hold with it disabled, and a `!Sync` engine cannot be shared
# across a multi-threaded reactor. The other two defaults are kept: the
# embedded public suffix list is what makes `$third-party` mean what the list
# author meant, and regex handling is needed for the patterns the name tier
# defers as `Deferred::Pattern`.
adblock = { version = "0.13.2", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
octets = "0.3.6"
quiche = "0.29.3"
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Local TCP termination (the substrate P14 MITM runs on) is a smoltcp socket set
# driven by the datapath. sans-io and no_std-friendly: it owns no socket and no
# clock, so it composes into the pure-core discipline rather than fighting it.
# `any-ip` is load-bearing — a terminating proxy answers SYNs addressed to
# arbitrary upstream servers, not to an address this interface owns.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }
# Named features rather than "full": the shell needs a runtime, bounded
# channels, a timer, and the `select!`/`pin!` macros, and nothing else. Boreas
# cross-compiles to Android, where every unused tokio driver is dead weight in
# the shipped artefact.
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The WebSocket VLESS transport. `default-features = false` drops `connect` and
# every TLS feature: this crate supplies the already-connected, already-TLS
# stream, so all that is wanted from here is the protocol itself — the
# handshake, frame masking, and the ping/pong and close state machine. It is
# the one genuinely new dependency the transport family needs, and it is the
# ecosystem's standard: ~62M recent downloads and released 2026-07.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Trait-only crates, for the `Stream` and `Sink` the WebSocket adapter polls.
# Deliberately not `futures-util`: only the two traits are needed.
futures-core = "0.3"
futures-sink = "0.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
# Trust anchors, for the originating side, which is now every side that dials
# out. `webpki-roots` ships SPKI-only `TrustAnchor`s — what rustls verifies
# against and what BoringSSL cannot load — so this is the same Mozilla bundle as
# whole DER certificates. rustls remains only as the terminating server, which
# verifies nothing and needs no anchors.
webpki-root-certs = "1"

# The Windows adapter loads the WireGuard-authorized signed wintun.dll at
# runtime; the bindings are Windows-only and never enter the Android graph.
[target.'cfg(windows)'.dependencies]
wintun-bindings = "0.7.39"

[dev-dependencies]
# The interop tests need a certificate for the reference server to present, and
# `quiche` loads trust anchors only from PEM files. `rcgen` is already a normal
# dependency for the interception CA; listing it here too is what makes it
# reachable from an integration test, and Cargo links the one copy.
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
# `test-util` provides the paused clock the P8 timer gate needs: virtual time
# is what lets the test assert wakeup counts without waiting an hour.
tokio = { version = "1.53.1", features = ["test-util"] }
# smoltcp is now a normal dependency (local TCP termination), so the P6 scaling
# example and the termination tests share the one linked copy.

[lib]
path = "src/lib.rs"
