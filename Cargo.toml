[package]
name = "boreas-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
bytes = "1.12.1"
etherparse = "0.21.0"
gotatun = { version = "0.8.1", default-features = false, features = ["ring"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client", "http1", "http2"] }
# HTTP/2 for the gRPC and HTTP VLESS transports, and `http`/`httparse` for
# building their requests and reading the HTTPUpgrade response. All three are
# already in the graph beneath `hyper`, so naming them here adds no code to the
# artefact — it only stops us reaching through a re-export for types we use
# directly.
h2 = "0.4.15"
http = "1.5.0"
httparse = "1.10.1"
# The P16 HTML tier. `lol_html` is Cloudflare's production streaming rewriter,
# which is what [Filtering](docs/filtering.md) names: it parses without a DOM,
# so a response is transformed as it arrives rather than buffered whole, and it
# carries the two things a proxy actually needs from such a thing — a hard
# memory ceiling per stream, and a bail-out that flushes what it was holding
# instead of losing it. `encoding_rs` and `base64` come with it and are named
# here because this crate calls them directly: the first to turn a `charset`
# label into an encoding, the second to write the `'sha256-...'` source that
# widens a Content-Security-Policy by exactly the style Boreas injects.
base64 = "0.22.1"
encoding_rs = "0.8.35"
lol_html = "3.0.1"
# Content-coding decoders for the HTML tier, and **decoders only**.
#
# A compressed document is opaque to a rewriter, and `Accept-Encoding: identity`
# only reaches origins that honour it — not a cache, not an intermediary, not a
# server that ignores it — so the tier needs to be able to read what actually
# arrives. gzip and Brotli are what browsers ask for and what CDNs serve; a
# coding neither of these covers still forwards untouched, which is the same
# fail-open path an unsupported charset already takes.
#
# **Nothing is recompressed on the way out, and that is a property of where the
# bytes go rather than a shortcut.** The leg from Boreas to the browser is
# local: the client's TCP connection is terminated on this device, so those
# bytes never touch a network. Recompressing them would spend CPU on a mobile
# battery to shrink a memory copy. The rewritten document is emitted as
# `identity` with streaming framing, which is exactly what
# [Filtering](docs/filtering.md)'s step 6 asks for.
#
# `rust_backend` keeps flate2 on `miniz_oxide` rather than a C zlib, which is
# what makes it cross-compile to Android with no toolchain of its own;
# `brotli-decompressor` is the decoder half of the `brotli` crate, so the
# encoder's tables never enter the artefact.
brotli-decompressor = { version = "5.0.3", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# The rule engine, as [Filtering](docs/filtering.md) specifies: `adblock`
# decides and `lol_html` transforms. Brave's implementation is the one shipping
# in a browser against the same lists Boreas targets, and it covers the two
# faculties the name tier counts as deferred — full URL matching with
# `$third-party`, `$script`, and `$domain=` options, and hostname-scoped
# cosmetic rules — neither of which is a parser worth writing twice.
#
# **`single-thread` is a default feature and must be off.** It swaps the
# engine's `Arc`s for `Rc`s, which costs `Send + Sync`; the crate's own static
# assertions only hold with it disabled, and a `!Sync` engine cannot be shared
# across a multi-threaded reactor. The other two defaults are kept: the
# embedded public suffix list is what makes `$third-party` mean what the list
# author meant, and regex handling is needed for the patterns the name tier
# defers as `Deferred::Pattern`.
adblock = { version = "0.13.2", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
octets = "0.3.6"
quiche = "0.29.3"
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Local TCP termination (the substrate P14 MITM runs on) is a smoltcp socket set
# driven by the datapath. sans-io and no_std-friendly: it owns no socket and no
# clock, so it composes into the pure-core discipline rather than fighting it.
# `any-ip` is load-bearing — a terminating proxy answers SYNs addressed to
# arbitrary upstream servers, not to an address this interface owns.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }
# Named features rather than "full": the shell needs a runtime, bounded
# channels, a timer, and the `select!`/`pin!` macros, and nothing else. Boreas
# cross-compiles to Android, where every unused tokio driver is dead weight in
# the shipped artefact.
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The WebSocket VLESS transport. `default-features = false` drops `connect` and
# every TLS feature: this crate supplies the already-connected, already-TLS
# stream, so all that is wanted from here is the protocol itself — the
# handshake, frame masking, and the ping/pong and close state machine. It is
# the one genuinely new dependency the transport family needs, and it is the
# ecosystem's standard: ~62M recent downloads and released 2026-07.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Trait-only crates, for the `Stream` and `Sink` the WebSocket adapter polls.
# Deliberately not `futures-util`: only the two traits are needed.
futures-core = "0.3"
futures-sink = "0.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
webpki-roots = "1"

# The Windows adapter loads the WireGuard-authorized signed wintun.dll at
# runtime; the bindings are Windows-only and never enter the Android graph.
[target.'cfg(windows)'.dependencies]
wintun-bindings = "0.7.39"

[dev-dependencies]
# The interop tests need a certificate for the reference server to present, and
# `quiche` loads trust anchors only from PEM files. `rcgen` is already a normal
# dependency for the interception CA; listing it here too is what makes it
# reachable from an integration test, and Cargo links the one copy.
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
# `test-util` provides the paused clock the P8 timer gate needs: virtual time
# is what lets the test assert wakeup counts without waiting an hour.
tokio = { version = "1.53.1", features = ["test-util"] }
# smoltcp is now a normal dependency (local TCP termination), so the P6 scaling
# example and the termination tests share the one linked copy.

[lib]
path = "src/lib.rs"
