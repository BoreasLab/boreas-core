[package]
name = "boreas-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
bytes = "1.12.1"
etherparse = "0.21.0"
gotatun = { version = "0.8.1", default-features = false, features = ["ring"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "client", "http1", "http2"] }
octets = "0.3.6"
quiche = "0.29.3"
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Local TCP termination (the substrate P14 MITM runs on) is a smoltcp socket set
# driven by the datapath. sans-io and no_std-friendly: it owns no socket and no
# clock, so it composes into the pure-core discipline rather than fighting it.
# `any-ip` is load-bearing — a terminating proxy answers SYNs addressed to
# arbitrary upstream servers, not to an address this interface owns.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }
# Named features rather than "full": the shell needs a runtime, bounded
# channels, a timer, and the `select!`/`pin!` macros, and nothing else. Boreas
# cross-compiles to Android, where every unused tokio driver is dead weight in
# the shipped artefact.
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
webpki-roots = "1"

# The Windows adapter loads the WireGuard-authorized signed wintun.dll at
# runtime; the bindings are Windows-only and never enter the Android graph.
[target.'cfg(windows)'.dependencies]
wintun-bindings = "0.7.39"

[dev-dependencies]
# `test-util` provides the paused clock the P8 timer gate needs: virtual time
# is what lets the test assert wakeup counts without waiting an hour.
tokio = { version = "1.53.1", features = ["test-util"] }
# smoltcp is now a normal dependency (local TCP termination), so the P6 scaling
# example and the termination tests share the one linked copy.

[lib]
path = "src/lib.rs"
