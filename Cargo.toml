[package]
name = "boreas-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
etherparse = "0.21.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
# The P6 scaling measurement (examples/smoltcp_scaling.rs). A dev-dependency:
# it never links into the library, and `cargo deny` still checks its license.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }

[lib]
path = "src/lib.rs"
